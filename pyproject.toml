[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-launcher"
version = "0.6.2"
description = "One Spark model catalog for Claude Code, Hermes, Codex, and OpenCode"
requires-python = ">=3.11"
dependencies = ["ruamel.yaml>=0.18.17,<0.19", "PyYAML>=6.0.2,<7", "rich==14.3.3"]
license = "MIT"

# Legacy Python reference tree. The Go command `cmd/sparky` is the
# production Sparky; this source is kept for reference tests and rollback.
# The former public `sparky = "spark_launcher.cli:main"` entrypoint is
# intentionally removed.

[tool.setuptools.packages.find]
where = ["src"]
